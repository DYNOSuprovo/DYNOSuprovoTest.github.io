<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Frame Analyzer — Auto-Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Consolas', 'Courier New', monospace; padding: 20px; }
  h1 { font-size: 16px; margin-bottom: 8px; color: #00f2ff; }
  #status { color: #4ade80; margin-bottom: 12px; font-size: 14px; min-height: 20px; }
  .progress-bar { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-bottom: 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00f2ff, #8b5cf6); border-radius: 3px; width: 0%; transition: width 0.15s linear; }
  video { display: block; width: 480px; height: 270px; background: #000; margin-bottom: 12px; border: 1px solid #333; }
  canvas { display: none; }
  #report { 
    background: #111; border: 1px solid #333; padding: 12px; 
    max-height: 70vh; overflow-y: auto; white-space: pre; 
    font-size: 11px; line-height: 1.5; color: #cbd5e1;
    margin-top: 10px;
  }
  #copyBtn { 
    padding: 10px 24px; font-size: 14px; cursor: pointer; 
    background: #00f2ff; color: #000; border: none; border-radius: 6px;
    font-weight: bold; margin-top: 8px; display: none;
  }
  #copyBtn:hover { background: #33f5ff; }
  .instruction { background: #1a1a2e; border: 1px solid #00f2ff33; padding: 10px; border-radius: 6px; margin: 10px 0; color: #94a3b8; font-size: 13px; display: none; }
</style>
</head>
<body>
  <h1>📹 VIDEO FRAME ANALYZER — AUTO-RUN MODE</h1>
  <div id="status">Initializing video decoder...</div>
  <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
  <video id="vid" src="test-video.mp4" muted preload="auto"></video>
  <canvas id="capture"></canvas>
  
  <div id="instruction" class="instruction">
    ✅ Analysis complete! Click the button below to copy the full report, then paste it back into the chat.
  </div>
  <button id="copyBtn" onclick="copyReport()">📋 COPY FULL REPORT TO CLIPBOARD</button>
  
  <div id="report">Waiting for video to load...</div>

<script>
const vid = document.getElementById('vid');
const canvas = document.getElementById('capture');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const progressFill = document.getElementById('progressFill');
const reportEl = document.getElementById('report');
const copyBtn = document.getElementById('copyBtn');
const instructionEl = document.getElementById('instruction');

let frames = [];

vid.addEventListener('loadedmetadata', () => {
  canvas.width = vid.videoWidth;
  canvas.height = vid.videoHeight;
  statusEl.textContent = `Video loaded: ${vid.duration.toFixed(2)}s @ ${vid.videoWidth}×${vid.videoHeight}. Starting auto-extraction...`;
  
  setTimeout(autoRun, 500);
});

vid.addEventListener('error', () => {
  statusEl.textContent = 'ERROR: Could not load video. Make sure you are accessing this via http://localhost:8000/analyzer.html';
  statusEl.style.color = '#ef4444';
});

async function autoRun() {
  // Phase 1: Extract frames
  const step = 0.25; // Extract every 0.25s for detailed analysis
  const totalFrames = Math.floor(vid.duration / step) + 1;
  
  for (let t = 0; t <= vid.duration; t += step) {
    await seekAndCapture(t);
    const pct = (frames.length / totalFrames * 100);
    progressFill.style.width = pct + '%';
    statusEl.textContent = `Extracting frame ${frames.length}/${totalFrames} (t=${t.toFixed(2)}s)...`;
  }
  
  statusEl.textContent = `Extracted ${frames.length} frames. Running scene analysis...`;
  progressFill.style.width = '100%';
  
  // Phase 2: Analyze
  await new Promise(r => setTimeout(r, 200));
  const report = analyzeSceneChanges();
  reportEl.textContent = report;
  
  copyBtn.style.display = 'block';
  instructionEl.style.display = 'block';
  statusEl.textContent = `✅ Analysis complete! ${frames.length} frames analyzed. Copy the report below and paste it back into the chat.`;
}

function seekAndCapture(time) {
  return new Promise(resolve => {
    vid.currentTime = time;
    vid.onseeked = () => {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      let totalR = 0, totalG = 0, totalB = 0;
      const sampleStep = 8;
      let samples = 0;
      for (let i = 0; i < data.length; i += 4 * sampleStep) {
        totalR += data[i];
        totalG += data[i + 1];
        totalB += data[i + 2];
        samples++;
      }
      
      const avgR = totalR / samples;
      const avgG = totalG / samples;
      const avgB = totalB / samples;
      const brightness = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);
      
      // Edge density (Sobel approximation)
      let edgeSum = 0;
      let edgeSamples = 0;
      const w = canvas.width;
      for (let y = 1; y < canvas.height - 1; y += 3) {
        for (let x = 1; x < w - 1; x += 3) {
          const idx = (y * w + x) * 4;
          const l = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
          const lR = 0.299 * data[idx+4] + 0.587 * data[idx+5] + 0.114 * data[idx+6];
          const lD = 0.299 * data[((y+1)*w+x)*4] + 0.587 * data[((y+1)*w+x)*4+1] + 0.114 * data[((y+1)*w+x)*4+2];
          edgeSum += Math.abs(l - lR) + Math.abs(l - lD);
          edgeSamples++;
        }
      }
      const edgeDensity = edgeSum / edgeSamples;

      // Center region analysis (center 30% of frame)
      const cx = Math.floor(w * 0.35);
      const cy = Math.floor(canvas.height * 0.35);
      const cw = Math.floor(w * 0.3);
      const ch = Math.floor(canvas.height * 0.3);
      const centerData = ctx.getImageData(cx, cy, cw, ch).data;
      let cR = 0, cG = 0, cB = 0, cSamples = 0;
      for (let i = 0; i < centerData.length; i += 32) {
        cR += centerData[i]; cG += centerData[i+1]; cB += centerData[i+2];
        cSamples++;
      }
      const centerR = cR / cSamples;
      const centerG = cG / cSamples;
      const centerB = cB / cSamples;
      const centerBright = centerR * 0.299 + centerG * 0.587 + centerB * 0.114;

      // Quadrant analysis
      const quadrants = [];
      const qw = Math.floor(w / 2);
      const qh = Math.floor(canvas.height / 2);
      for (let qy = 0; qy < 2; qy++) {
        for (let qx = 0; qx < 2; qx++) {
          const qData = ctx.getImageData(qx * qw, qy * qh, qw, qh).data;
          let qBright = 0, qS = 0;
          for (let i = 0; i < qData.length; i += 64) {
            qBright += qData[i] * 0.299 + qData[i+1] * 0.587 + qData[i+2] * 0.114;
            qS++;
          }
          quadrants.push(qBright / qS);
        }
      }
      
      frames.push({
        time, avgR, avgG, avgB, brightness, edgeDensity,
        centerBright, centerR, centerG, centerB,
        quadrants
      });
      
      resolve();
    };
  });
}

function analyzeSceneChanges() {
  let r = '';
  r += `VIDEO ANALYSIS REPORT\n`;
  r += `${'='.repeat(70)}\n`;
  r += `Duration: ${vid.duration.toFixed(3)}s\n`;
  r += `Resolution: ${vid.videoWidth}×${vid.videoHeight}\n`;
  r += `Frames Captured: ${frames.length} (every 0.25s)\n`;
  r += `File: test-video.mp4\n\n`;

  // Frame-by-frame table
  r += `FRAME-BY-FRAME DATA\n`;
  r += `${'-'.repeat(70)}\n`;
  r += `Time   | Bright | Edge  | CenterB | Color(R,G,B)   | Δ     | Events\n`;
  r += `${'-'.repeat(70)}\n`;

  let scenes = [];
  let sceneStart = 0;
  
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    let delta = 0;
    let events = [];
    
    if (i > 0) {
      const p = frames[i - 1];
      const brightΔ = f.brightness - p.brightness;
      const colorΔ = Math.sqrt((f.avgR-p.avgR)**2 + (f.avgG-p.avgG)**2 + (f.avgB-p.avgB)**2);
      const edgeΔ = f.edgeDensity - p.edgeDensity;
      const centerΔ = f.centerBright - p.centerBright;
      
      delta = Math.abs(brightΔ) + colorΔ * 0.5 + Math.abs(edgeΔ) * 2 + Math.abs(centerΔ) * 0.8;
      
      if (brightΔ > 5) events.push('BRIGHTEN');
      if (brightΔ < -5) events.push('DARKEN');
      if (edgeΔ > 2) events.push('DETAIL_UP');
      if (edgeΔ < -2) events.push('DETAIL_DOWN');
      if (centerΔ > 10) events.push('CENTER_GLOW');
      if (centerΔ < -10) events.push('CENTER_FADE');
      if (colorΔ > 15) events.push('COLOR_SHIFT');
      if (delta > 25) events.push('>>> SCENE_CHANGE');
    }

    const tStr = f.time.toFixed(2).padStart(6);
    const bStr = f.brightness.toFixed(0).padStart(6);
    const eStr = f.edgeDensity.toFixed(1).padStart(5);
    const cStr = f.centerBright.toFixed(0).padStart(7);
    const rgbStr = `(${f.avgR.toFixed(0).padStart(3)},${f.avgG.toFixed(0).padStart(3)},${f.avgB.toFixed(0).padStart(3)})`;
    const dStr = delta.toFixed(0).padStart(5);
    
    r += `${tStr}s | ${bStr} | ${eStr} | ${cStr} | ${rgbStr} | ${dStr} | ${events.join(' ')}\n`;

    if (delta > 25 && i > 0) {
      scenes.push({ start: frames[sceneStart].time, end: frames[i-1].time, startIdx: sceneStart, endIdx: i-1 });
      sceneStart = i;
    }
  }
  scenes.push({ start: frames[sceneStart].time, end: frames[frames.length-1].time, startIdx: sceneStart, endIdx: frames.length-1 });

  // Scene breakdown
  r += `\n\nSCENE BREAKDOWN (auto-detected)\n`;
  r += `${'='.repeat(70)}\n`;
  
  scenes.forEach((s, i) => {
    const sFrames = frames.slice(s.startIdx, s.endIdx + 1);
    const avgBright = sFrames.reduce((a,f) => a + f.brightness, 0) / sFrames.length;
    const avgEdge = sFrames.reduce((a,f) => a + f.edgeDensity, 0) / sFrames.length;
    const avgCenter = sFrames.reduce((a,f) => a + f.centerBright, 0) / sFrames.length;
    const sF = frames[s.startIdx];
    const eF = frames[s.endIdx];
    const brightTrend = eF.brightness - sF.brightness;
    const edgeTrend = eF.edgeDensity - sF.edgeDensity;
    const centerTrend = eF.centerBright - sF.centerBright;
    
    // Detect dominant motion direction from quadrants
    let motionDesc = '';
    if (sFrames.length > 2) {
      const firstQ = sFrames[0].quadrants;
      const lastQ = sFrames[sFrames.length-1].quadrants;
      const qΔ = lastQ.map((v,j) => v - firstQ[j]);
      const maxQ = Math.max(...qΔ.map(Math.abs));
      const maxIdx = qΔ.map(Math.abs).indexOf(maxQ);
      const labels = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
      if (maxQ > 5) {
        motionDesc = `Energy ${qΔ[maxIdx] > 0 ? 'expanding toward' : 'receding from'} ${labels[maxIdx]}`;
      } else {
        motionDesc = 'Uniform/centered motion';
      }
    }
    
    r += `\nScene ${i+1}: ${s.start.toFixed(2)}s → ${s.end.toFixed(2)}s (${(s.end-s.start).toFixed(2)}s)\n`;
    r += `  Avg Brightness: ${avgBright.toFixed(1)} | Trend: ${brightTrend > 2 ? '↑ brightening' : brightTrend < -2 ? '↓ darkening' : '→ stable'} (Δ${brightTrend > 0 ? '+' : ''}${brightTrend.toFixed(0)})\n`;
    r += `  Avg Edge Detail: ${avgEdge.toFixed(1)} | Trend: ${edgeTrend > 1 ? '↑ sharpening' : edgeTrend < -1 ? '↓ softening' : '→ stable'} (Δ${edgeTrend > 0 ? '+' : ''}${edgeTrend.toFixed(1)})\n`;
    r += `  Center Luminance: ${avgCenter.toFixed(1)} | Trend: ${centerTrend > 5 ? '↑ core growing' : centerTrend < -5 ? '↓ core receding' : '→ stable'} (Δ${centerTrend > 0 ? '+' : ''}${centerTrend.toFixed(0)})\n`;
    r += `  Color Start: RGB(${sF.avgR.toFixed(0)},${sF.avgG.toFixed(0)},${sF.avgB.toFixed(0)}) → End: RGB(${eF.avgR.toFixed(0)},${eF.avgG.toFixed(0)},${eF.avgB.toFixed(0)})\n`;
    r += `  Center Color: RGB(${sF.centerR.toFixed(0)},${sF.centerG.toFixed(0)},${sF.centerB.toFixed(0)}) → RGB(${eF.centerR.toFixed(0)},${eF.centerG.toFixed(0)},${eF.centerB.toFixed(0)})\n`;
    r += `  Motion: ${motionDesc}\n`;
  });

  // Brightness curve CSV
  r += `\n\nBRIGHTNESS CURVE DATA (CSV)\n`;
  r += `${'-'.repeat(70)}\n`;
  r += `time,brightness,edgeDensity,centerBright,avgR,avgG,avgB,centerR,centerG,centerB,q_TL,q_TR,q_BL,q_BR\n`;
  frames.forEach(f => {
    r += `${f.time.toFixed(2)},${f.brightness.toFixed(1)},${f.edgeDensity.toFixed(1)},${f.centerBright.toFixed(1)},${f.avgR.toFixed(0)},${f.avgG.toFixed(0)},${f.avgB.toFixed(0)},${f.centerR.toFixed(0)},${f.centerG.toFixed(0)},${f.centerB.toFixed(0)},${f.quadrants.map(q => q.toFixed(0)).join(',')}\n`;
  });

  return r;
}

function copyReport() {
  const text = reportEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = '✅ COPIED! Paste it in the chat.';
    copyBtn.style.background = '#10b981';
  }).catch(() => {
    // Fallback: select the report text
    const range = document.createRange();
    range.selectNodeContents(reportEl);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    copyBtn.textContent = 'Text selected — Press Ctrl+C to copy';
  });
}
</script>
</body>
</html>
